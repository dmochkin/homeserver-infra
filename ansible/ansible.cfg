[defaults]
inventory = inventory/prod.yml
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = false

[privilege_escalation]
become = true
become_method = sudo
# Ubuntu 26.04's default sudo is sudo-rs, which wraps custom password prompts,
# so Ansible never recognizes the prompt and times out. sudo.ws is the original
# sudo, shipped in the "sudo" package alongside it.
become_exe = sudo.ws
