# Applies one app's secrets (loop variable: secret_file). Runs on the admin machine.

- name: Name the app {{ secret_file | basename | replace('.enc.yaml', '') }}
  ansible.builtin.set_fact:
    secret_app: "{{ secret_file | basename | replace('.enc.yaml', '') }}"

- name: Create the namespace for {{ secret_app }}
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ secret_app }}"
  delegate_to: localhost
  become: false

- name: Decrypt the secrets of {{ secret_app }}
  ansible.builtin.set_fact:
    app_env: "{{ lookup('community.sops.sops', secret_file) | from_yaml }}"
  no_log: true

# Environment variables are text. Quoting every value avoids surprises such as
# YAML turning true into "True". The message names keys only, never values.
- name: Check every secret of {{ secret_app }} is a quoted string
  ansible.builtin.assert:
    that: unquoted | length == 0
    fail_msg: "In {{ secret_file | basename }}, quote these values: {{ unquoted | join(', ') }}"
    quiet: true
  vars:
    unquoted: "{{ app_env | dict2items | rejectattr('value', 'string') | map(attribute='key') | list }}"

# Values are sent base64-encoded in "data" so an unchanged Secret reports no change.
- name: Apply the secrets of {{ secret_app }}
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ secret_app }}-env"
        namespace: "{{ secret_app }}"
        labels:
          app.kubernetes.io/managed-by: ansible
      data: "{{ dict(app_env.keys() | zip(app_env.values() | map('b64encode'))) }}"
  delegate_to: localhost
  become: false
  no_log: true
  register: app_secret

- name: Restart {{ secret_app }} so it picks up changed secrets
  ansible.builtin.command: kubectl --namespace {{ secret_app }} rollout restart deployment/{{ secret_app }}
  register: app_restart
  failed_when: app_restart.rc != 0 and 'not found' not in app_restart.stderr
  delegate_to: localhost
  become: false
  when: app_secret.changed and not ansible_check_mode
