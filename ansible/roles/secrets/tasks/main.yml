# App secrets: each secrets/apps/<app>.enc.yaml holds that app's environment variables.
# They are decrypted on the admin machine and applied as the Kubernetes Secret <app>-env
# in the app's namespace (encrypted at rest by k3s). The runner never holds the age key.

- name: Find the apps that have secrets
  ansible.builtin.set_fact:
    app_secret_files: "{{ query('ansible.builtin.fileglob', playbook_dir ~ '/../secrets/apps/*.enc.yaml') | sort }}"

- name: Apply each app's secrets
  ansible.builtin.include_tasks: app-secret.yml
  loop: "{{ app_secret_files }}"
  loop_control:
    loop_var: secret_file
    label: "{{ secret_file | basename | replace('.enc.yaml', '') }}"

# The age private key on the server, for restoring and testing backups.

- name: Create the folder for the age key
  ansible.builtin.file:
    path: /etc/homeserver/age
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Put the age private key on the server
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'SOPS_AGE_KEY_FILE')) }}\n"
    dest: /etc/homeserver/age/keys.txt
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
