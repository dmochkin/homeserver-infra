- name: Reload SSH
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
  when: not ansible_check_mode
