# One shared Postgres 17 in namespace "postgres", applied from the admin machine.
# Data lives on the server's disk through k3s's local-path storage.

- name: Create the postgres namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: postgres
  delegate_to: localhost
  become: false

- name: Store the Postgres superuser password
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: postgres-superuser
        namespace: postgres
      data:
        POSTGRES_PASSWORD: "{{ secrets.postgres_password | b64encode }}"
  delegate_to: localhost
  become: false
  no_log: true

- name: Run Postgres
  kubernetes.core.k8s:
    template: postgres.yaml.j2
    wait: true
    wait_timeout: 300
  delegate_to: localhost
  become: false

- name: Wait for Postgres to accept connections
  ansible.builtin.command: kubectl --namespace postgres exec postgres-0 -- pg_isready --username postgres
  register: postgres_ready
  until: postgres_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

# A small database with 100 known rows, so backups and restore checks always have real data to verify.

- name: Check whether the canary database exists
  ansible.builtin.command: >-
    kubectl --namespace postgres exec postgres-0 --
    psql --username postgres --tuples-only --no-align
    --command "SELECT 1 FROM pg_database WHERE datname = 'canary'"
  register: canary_exists
  changed_when: false
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

- name: Create the canary database
  ansible.builtin.command:
    cmd: kubectl --namespace postgres exec --stdin postgres-0 -- psql --username postgres --set ON_ERROR_STOP=1
    stdin: |
      CREATE DATABASE canary;
      \connect canary
      CREATE TABLE canary (id integer PRIMARY KEY, note text NOT NULL);
      INSERT INTO canary SELECT n, 'row ' || n FROM generate_series(1, 100) AS n;
  delegate_to: localhost
  become: false
  when: not ansible_check_mode and canary_exists.stdout != '1'

# One database and user per app whose secrets file has DATABASE_PASSWORD.

- name: Set up each app's database
  ansible.builtin.include_tasks: app-database.yml
  loop: "{{ query('ansible.builtin.fileglob', playbook_dir ~ '/../secrets/apps/*.enc.yaml') | sort }}"
  loop_control:
    loop_var: secret_file
    label: "{{ secret_file | basename | replace('.enc.yaml', '') }}"
  when: not ansible_check_mode
