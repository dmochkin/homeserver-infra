# Creates the database and user for one app (loop variable: secret_file) if its
# secrets include DATABASE_PASSWORD. Names: the app name with dashes as underscores.

- name: Read the database password of {{ secret_file | basename | replace('.enc.yaml', '') }}
  ansible.builtin.set_fact:
    db_app: "{{ secret_file | basename | replace('.enc.yaml', '') }}"
    db_name: "{{ secret_file | basename | replace('.enc.yaml', '') | replace('-', '_') }}"
    db_password: "{{ (lookup('community.sops.sops', secret_file) | from_yaml).DATABASE_PASSWORD | default('') }}"
  no_log: true

- name: Create the database and user of {{ db_app }}
  when: db_password | length > 0
  block:
    - name: Check whether the database of {{ db_app }} exists
      ansible.builtin.command: >-
        kubectl --namespace postgres exec postgres-0 --
        psql --username postgres --tuples-only --no-align
        --command "SELECT 1 FROM pg_database WHERE datname = '{{ db_name }}'"
      register: db_exists
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Create the database and user of {{ db_app }}
      ansible.builtin.command:
        cmd: kubectl --namespace postgres exec --stdin postgres-0 -- psql --username postgres --set ON_ERROR_STOP=1
        stdin: |
          CREATE ROLE {{ db_name }} LOGIN;
          CREATE DATABASE {{ db_name }} OWNER {{ db_name }};
          REVOKE ALL ON DATABASE {{ db_name }} FROM PUBLIC;
      delegate_to: localhost
      become: false
      when: db_exists.stdout != '1'

    # Sent on stdin so the password never appears in a command line. Postgres can't report
    # whether the password changed, so this runs every time and reports no change.
    - name: Set the database password of {{ db_app }}
      ansible.builtin.command:
        cmd: kubectl --namespace postgres exec --stdin postgres-0 -- psql --username postgres --set ON_ERROR_STOP=1 --quiet
        stdin: "ALTER ROLE {{ db_name }} PASSWORD '{{ db_password | replace(\"'\", \"''\") }}';"
      changed_when: false
      delegate_to: localhost
      become: false
      no_log: true
