# The manifest contains the real domain, so it lives only on the server (root-only folder), not in the repo.
- name: Deploy the hello-world status page
  ansible.builtin.template:
    src: hello-world.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/hello-world.yaml
    owner: root
    group: root
    mode: "0600"
  # Never show the rendered manifest: it contains the domain (AGENTS.md rule 1).
  diff: false
  # A dry run before k3s is installed has no cluster to check against.
  when: not (ansible_check_mode and k3s_installed.rc != 0)
