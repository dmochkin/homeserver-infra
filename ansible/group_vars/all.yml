server_timezone: America/Toronto

# Reboot to finish updates only when one is required, Sundays at 4am server time.
reboot_schedule: "Sun *-*-* 04:00:00"

# SSH is reachable only on this interface.
admin_interface: tailscale0

# The server's Tailscale (MagicDNS) name, used by kubectl on the admin machine.
server_tailscale_name: homeserver

# k3s: pinned version; the install script verifies the binary's SHA-256.
k3s_version: v1.37.2+k3s1
pod_network: 10.42.0.0/16
service_network: 10.43.0.0/16

# Cloudflare Tunnel connector, installed from Cloudflare's Helm chart from the admin machine.
cloudflared_chart_version: 0.1.2
cloudflared_version: "2026.10.7"

# Hello-world status page at status.<domain>.
status_page_image: nginxinc/nginx-unprivileged:1.30.6-alpine

# Deploy by tag: Helm on the server, and one GitHub Actions runner per app repo.
helm_version: v4.3.1
helm_checksum: sha256:0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
# Used only to install a new runner; runners then update themselves (GitHub requires current runners).
runner_version: "2.338.2"
runner_checksum: sha256:baebf204307bac6193480852732f0aba2ae97b6c5597c244f4d5558390147c40
# App repos that deploy to this server, by name. The GitHub account comes from `gh` on the admin machine.
runner_repos:
  - hello-world

# Postgres 17: one shared instance, one database and user per app.
postgres_image: postgres:17.9-alpine3.23
postgres_storage: 20Gi

# Backups: nightly encrypted dumps to Cloudflare R2, kept 7 days (daily) and 28 days (weekly).
backup_schedule: "0 3 * * *"
restore_check_schedule: "0 5 1 * *"
backup_keep_daily: 7d
backup_keep_weekly: 28d
