apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
    spec:
      {{- include "app.podSecurity" . | nindent 6 }}
      containers:
        - name: app
          image: {{ include "app.image" . }}
          # Built on the server and imported into k3s; never pulled.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          {{- include "app.env" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
          livenessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            initialDelaySeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- include "app.containerSecurity" . | nindent 10 }}
