{{- $subdomains := compact (prepend .Values.extraSubdomains .Values.subdomain) | uniq }}
{{- if $subdomains }}
{{- $domain := required "domain is set by the deploy script" .Values.domain }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
    {{- range $subdomains }}
    - host: {{ . }}.{{ $domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}
                port:
                  name: http
    {{- end }}
{{- end }}
