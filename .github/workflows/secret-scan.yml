# Scans the full history for secrets on every push to any branch, so a leak is reported
# as soon as it reaches GitHub, and on pull requests from forks. Pull requests from this
# repo's own branches are skipped: their pushes were already scanned, and the pull
# request shows that check.
# Uses pull_request (not pull_request_target), so a fork's code runs with read-only
# access and no secrets. Runs on GitHub-hosted runners, never on the home server.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Same pinned image as .githooks/pre-commit and .githooks/pre-push; keep in sync.
      - name: Scan for secrets with gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner /repo
