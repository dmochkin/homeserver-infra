# Scans the full history for secrets on every pull request and on every push to main
# (branch pushes are covered by their pull request, so each change is scanned once).
# Runs on GitHub-hosted runners, never on the home server.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Same pinned image as .githooks/pre-commit and .githooks/pre-push; keep in sync.
      - name: Scan for secrets with gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner /repo
